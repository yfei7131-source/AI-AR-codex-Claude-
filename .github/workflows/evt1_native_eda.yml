name: EVT-1 native schematic and FPGA validation
on:
  push:
    branches:
      - hardware/evt1-native-eda-20261118
      - hardware/evt1-h03-h05-20261119
      - hardware/evt1-h02-h03-native-20261120
  workflow_dispatch:

permissions:
  contents: read

env:
  EVT1_PACKAGE: hardware/evt1-native-eda-20261118

jobs:
  fpga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Software wire encoding against inherited RTL
        run: python3 "$EVT1_PACKAGE/host/check_bridge.py"
      - name: Reproduce malformed host control and test recovery
        if: github.ref_name == 'hardware/evt1-h03-h05-20261119'
        run: make -C hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL sim-framing
      - name: Native display, shutdown, synthesis, routing and independent STA
        run: make -C hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL all
      - name: Preserve actual tool outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evt1-native-fpga
          path: |
            hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL/*.log
            hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL/*.rpt
            hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL/*.json
            hardware/evt1-rev-d1-1-20261117/03_FPGA_RTL/*.asc

  native-erc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce audited electrical and PCB inputs
        run: |
          python3 "$EVT1_PACKAGE/Inputs/build_effective_inputs.py" --check
          python3 "$EVT1_PACKAGE/tools/build_pcb_constraints.py" --check
          python3 "$EVT1_PACKAGE/tools/generate_kicad.py"
          git diff --exit-code -- "$EVT1_PACKAGE/kicad"
          test -z "$(git ls-files --others --exclude-standard -- "$EVT1_PACKAGE/kicad")"
      - name: Replay archived bridge placement and supplier envelope assessment
        if: github.ref_name == 'hardware/evt1-h03-h05-20261119'
        run: |
          python3 -m unittest discover -s "$EVT1_PACKAGE/closure" -p test_bridge_placement.py -v
          python3 "$EVT1_PACKAGE/closure/check_bridge_placement.py" --check
          verdict=0
          python3 "$EVT1_PACKAGE/closure/check_bridge_placement.py" --check --strict || verdict=$?
          test "$verdict" -eq 1
      - name: Verify effective electrical bounds and bench probe coverage
        if: github.ref_name == 'hardware/evt1-h03-h05-20261119'
        run: |
          python3 "$EVT1_PACKAGE/closure/check_electrical_inputs.py" > "$RUNNER_TEMP/electrical_inputs.json"
          diff --strip-trailing-cr -u "$EVT1_PACKAGE/closure/evidence/electrical_inputs.json" "$RUNNER_TEMP/electrical_inputs.json"
      - name: KiCad CLI version, electrical rules and native netlist parity
        run: |
          mkdir -p "$PWD/ci-kicad-evidence"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/work" -w /work --entrypoint /bin/bash \
            kicad/kicad:10.0@sha256:3f4a01786dfbe803a65f345c3342b765db9add913f5e9448f8356793714ddc34 \
            -ec "kicad-cli version
                 python3 '$EVT1_PACKAGE/tools/build_footprint_map.py' --libraries /usr/share/kicad/footprints --check
                 python3 '$EVT1_PACKAGE/tools/verify_kicad.py' --kicad-cli kicad-cli --output /work/ci-kicad-evidence --pdf"
      - name: Preserve raw KiCad reports and exported nets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evt1-native-erc
          if-no-files-found: error
          path: ci-kicad-evidence/
