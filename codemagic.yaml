# yaml-language-server: $schema=https://codemagic.io/codemagic-schema.json
workflows:
  ios-unsigned:
    name: AIAR iOS unsigned compile and tests
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      node: '22'
      vars:
        AI_PROVIDER: demo
    scripts:
      - name: Validate native permissions and project inputs
        script: |
          set -euo pipefail
          python3 mobile/ios/ci/validate_ios.py
          plutil -lint mobile/ios/Runner/Info.plist
          plutil -lint mobile/ios/Runner.xcodeproj/project.pbxproj
      - name: Test Python gateway and image contracts
        script: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), "CI requires Python 3.12 for pinned Pillow/cryptography dependencies"'
          python3 -m venv /tmp/aiar-ci-python
          /tmp/aiar-ci-python/bin/python -m pip install -r requirements.txt -r requirements-gateway.txt
          /tmp/aiar-ci-python/bin/python -m unittest discover -s tests -v
      - name: Test Web media bridge contracts
        script: |
          set -euo pipefail
          node --version
          node --test mobile/test/browser_bridge.test.cjs
      - name: Resolve Flutter dependencies
        working_directory: mobile
        script: |
          set -euo pipefail
          flutter --version
          flutter pub get
      - name: Analyze and test Dart including native bridge codecs
        working_directory: mobile
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Compile Swift and iOS device app without signing
        working_directory: mobile
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ios/unsigned
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned/Runner.app.zip
          shasum -a 256 build/ios/unsigned/Runner.app.zip > build/ios/unsigned/Runner.app.zip.sha256
          printf '%s\n' 'Unsigned compile artifact only. Not installable on an iPhone. No signing or publishing ran.' > build/ios/unsigned/BUILD_SCOPE.txt
    artifacts:
      - mobile/build/ios/unsigned/Runner.app.zip
      - mobile/build/ios/unsigned/Runner.app.zip.sha256
      - mobile/build/ios/unsigned/BUILD_SCOPE.txt
      - /tmp/xcodebuild_logs/*.log
